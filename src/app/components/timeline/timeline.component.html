<section
  class="mb-4 border-r-0 border-y-0 border-l-2 border-solid border-gray-secondary max-md:mx-4"
>
  <ul class="flex flex-col gap-14 pt-2">
    @for (project of projects(); track $index; let itemIndex = $index) {
    <li appReveal [revealDelay]="80 + (itemIndex * 90)" class="relative group">
      <div
        class="absolute left-[-7px] top-1 w-3 h-3 rounded-full bg-primary-brand ring-4 ring-[var(--bg-app)] transition-all duration-300 group-hover:scale-125 group-hover:shadow-[0_0_12px_rgba(123,58,242,0.4)]"
      ></div>
      <div class="flex flex-col pl-6 gap-1.5">
        <small
          class="text-gray-primary text-xs font-medium uppercase tracking-wider"
          >{{ project.year }}</small
        >
        <div class="flex items-center gap-3 max-md:items-start">
          @if (project.miniLogo) {
          <img
            [src]="project.miniLogo"
            [alt]="project.title + ' logo'"
            class="h-7 w-7 object-contain rounded"
          />
          }
          <span class="text-ft-primary font-bold text-xl tracking-tight">{{
            project.title
          }}</span>
        </div>
        <small
          class="text-gray-primary font-medium text-sm cursor-pointer transition-all duration-300 ease-in-out hover:text-primary-brand w-fit"
          (click)="seeMore(project.path)"
        >
          {{ "TIMELINE.ACTION" | translate }}
          <i
            class="fa-solid fa-arrow-right text-xs ml-1 transition-transform duration-300 group-hover:translate-x-1"
          ></i>
        </small>
      </div>
    </li>
    }
  </ul>
</section>
