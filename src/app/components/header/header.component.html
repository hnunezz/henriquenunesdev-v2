<header class="items-center grid">
  @if (router.url !== '/home' && router.url !== '/about') {
  <div
    appReveal
    [revealDelay]="120"
    class="flex items-center gap-3 hover:opacity-80 cursor-pointer group w-fit"
    [routerLink]="'/home'"
  >
    <span
      class="hns-logo text-xl text-ft-primary group-hover:text-primary-brand transition-colors duration-300"
    >
      hn.
    </span>
  </div>
  } @else {
  <span></span>
  }

  <nav
    #navPill
    class="nav-pill flex rounded-full h-[52px] justify-evenly items-center z-50 px-2 max-md:hidden"
  >
    <span
      class="nav-glider"
      [class.visible]="glider().visible"
      [style.transform]="'translateX(' + glider().left + 'px)'"
      [style.width.px]="glider().width"
    ></span>
    @for (nav of navigation(); track $index) {
    <span
      class="nav-link cursor-pointer text-sm font-medium text-[#a1a1aa] transition-colors duration-300 ease-in-out hover:text-primary-brand px-4 py-2 rounded-full"
      [ngClass]="{ active: router.url === nav.anchor }"
      [routerLink]="nav.anchor"
    >
      {{ nav.labelKey | translate }}
    </span>
    }
  </nav>

  <p class="hidden max-md:flex">&nbsp;</p>

  <div appReveal [revealStagger]="80" class="flex justify-end gap-2">
    <div
      (click)="open()"
      class="mobile-nav header-action-btn menu justify-center items-center cursor-pointer hidden max-md:flex gap-2"
    >
      <span class="text-xs font-medium"> Menu </span>

      <span class="menu-icon-swap">
        <i class="fa-solid fa-bars text-xs" [class.slide-away]="menuService.menuOpen()"></i>
        <i class="fa-solid fa-bars-staggered text-xs" [class.slide-ready]="!menuService.menuOpen()"></i>
      </span>
    </div>

    <div class="toggle-pill">
      <i class="fa-solid fa-globe pill-globe"></i>
      <span class="pill-sep"></span>
      <div class="pill-track">
        <div class="pill-indicator" [class.slide-right]="lang() === 'en'"></div>
        <button class="pill-opt" [class.active]="lang() === 'pt'" (click)="selectLang('pt')">PT</button>
        <button class="pill-opt" [class.active]="lang() === 'en'" (click)="selectLang('en')">EN</button>
      </div>
    </div>

    <div
      class="header-action-btn flex justify-center items-center cursor-pointer"
      (click)="toggleTheme()"
    >
      <span
        [class.icon-out]="themeAnim() === 'out'"
        [class.icon-in]="themeAnim() === 'in'"
      >
        @if (themeService.currentTheme() === 'light') {
        <i class="fa-solid fa-circle-dot text-ft-primary text-lg"></i>
        } @else {
        <i class="fa-regular fa-circle-dot text-ft-primary text-lg"></i>
        }
      </span>
    </div>
  </div>
</header>
