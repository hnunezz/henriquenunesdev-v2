<div class="flex gap-6 max-md:flex-col-reverse">
      <div
        #dropArea
        class="drop-area rounded-xl w-[80%] h-80 relative bg-transparent grid place-items-center border-2 border-dashed border-gray-secondary max-md:w-full transition-all duration-300"
        [class.drop-allowed]="hoverAllowed"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event)"
      >
        @if (items.length === 0) {
          <span class="opacity-40 font-medium text-center text-sm max-md:text-xs text-gray-primary">{{"ABOUT.DROPAREA" | translate}}</span>
        }

        @for (it of items; track $index) {
          <i
          class="fa-brands fa-{{ it.label }} cursor-grab select-none text-[72px] transition-all duration-300 ease-in-out chip placed"
          [style.left.px]="it.x"
          [style.color]="it.color"
          [style.top.px]="it.y"></i>
        }
      </div>

      <div class="palette w-[20%] p-4 justify-center items-center text-center grid grid-cols-[repeat(auto-fill,minmax(50px,1fr))] rounded-xl gap-3 border border-gray-secondary bg-surface max-md:w-full">
        @for (p of palette; track $index) {
        <i draggable="true" class="cursor-grab select-none text-gray-primary text-[36px] transition-all duration-300 ease-in-out hover:text-ft-primary hover:scale-110 chip" class="fa-brands fa-{{p.label}}" (dragstart)="onDragStart($event, p.id)"></i>
        }
      </div>
    </div>
