<main class="px-10 max-md:px-4">
  <div class="flex items-center gap-3 mb-10 pt-2">
    <a
      routerLink="/articles"
      class="inline-flex items-center gap-2 text-sm font-medium text-gray-primary no-underline transition-colors duration-200 hover:text-ft-primary"
    >
      <i class="fa-solid fa-arrow-left"></i>
      {{ "ARTICLES.BACK" | translate }}
    </a>
  </div>

  <div class="flex flex-col items-center text-center gap-4 mb-0">
    <h1 class="text-3xl font-extrabold tracking-tight max-w-2xl leading-tight">
      {{ article.title }}
    </h1>

    <i
      class="text-2xl fa-brands fa-medium text-gray-primary cursor-pointer transition-all duration-300 ease-in-out hover:text-ft-primary"
      (click)="goTo(article.link)"
    ></i>
  </div>

  <hr class="divider !my-12" />

  <div #contentRef class="flex justify-center items-center pb-12">
    <div
      class="article flex flex-col gap-6 text-base w-[min(720px,100%)] font-normal text-gray-primary leading-relaxed"
      [innerHTML]="article.content | safeHtml"
    ></div>
  </div>

  <div
    #bottomNavRef
    class="flex items-center justify-center gap-4 pt-12 pb-16 border-t border-[var(--gray-secondary)] mt-4"
  >
    <a
      routerLink="/articles"
      class="inline-flex items-center gap-2 text-sm font-medium text-gray-primary no-underline transition-colors duration-200 hover:text-ft-primary"
    >
      <i class="fa-solid fa-list"></i>
      {{ "ARTICLES.BACK" | translate }}
    </a>

    <span class="text-gray-primary opacity-30">·</span>
    <button
      (click)="scrollToTop()"
      class="inline-flex items-center gap-2 text-sm font-medium text-gray-primary transition-colors duration-200 hover:text-ft-primary bg-transparent border-none cursor-pointer"
    >
      <i class="fa-solid fa-arrow-up"></i>
      {{ "ARTICLES.BACK_TO_TOP" | translate }}
    </button>
  </div>
</main>

<!-- Reading progress indicator -->
<div
  class="fixed right-5 top-1/2 -translate-y-1/2 z-50 pointer-events-none transition-opacity duration-500"
  [class.opacity-0]="readingProgress() === 0"
  [class.opacity-100]="readingProgress() > 0"
>
  <div
    class="relative w-[2px] h-20 rounded-full overflow-hidden bg-[var(--gray-secondary)] opacity-20"
  >
    <div
      class="absolute top-0 left-0 w-full rounded-full transition-[height,background-color] duration-300 ease-out"
      [style.height.%]="readingProgress()"
      [style.background-color]="reachedEnd() ? '#4ade80' : 'var(--ft-primary)'"
    ></div>
  </div>
</div>
