<main class="px-10 max-md:px-4">
  <div class="flex flex-col items-center text-center gap-4 mb-0">
    <h1 class="text-3xl font-extrabold tracking-tight max-w-2xl leading-tight">
      {{article.title}}
    </h1>

    <i class="text-2xl fa-brands fa-medium text-gray-primary cursor-pointer transition-all duration-300 ease-in-out hover:text-ft-primary"
      (click)="goTo(article.link)"></i>
  </div>

  <hr class="divider !my-12">

  <div class="flex justify-center items-center pb-12">
    <div class="article flex flex-col gap-6 text-base w-[min(720px,100%)] font-normal text-gray-primary leading-relaxed" [innerHTML]="article.content | safeHtml"></div>
  </div>
</main>
